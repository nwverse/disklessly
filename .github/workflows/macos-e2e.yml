name: macOS E2E

on:
  push:
    branches: [feat/mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show macOS and toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: End-to-end harness
        env:
          E2E_LOG_FILE: ${{ runner.temp }}/isenough-e2e.log
        run: bash scripts/e2e.sh
      - name: Upload E2E log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-e2e-log
          path: ${{ runner.temp }}/isenough-e2e.log
          if-no-files-found: warn
