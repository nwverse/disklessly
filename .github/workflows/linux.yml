name: Linux

# Minutes budget: push runs only on main; branches are covered by their PR run,
# so a branch with an open PR is no longer built twice. Docs-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        swift: ["5.10", "6.1"]
    container: swift:${{ matrix.swift }}-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers and test tools
        # python3 and sqlite3 back the WebDAV/OpenList fixtures and the index tests.
        run: apt-get update && apt-get install -y libsqlite3-dev g++ python3 sqlite3 curl
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel
      - name: Smoke-run the CLI
        run: bash scripts/linux-smoke.sh "$(swift build --show-bin-path)/disklessly"
