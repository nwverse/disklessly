name: Daily

# The only schedule in this repo. Linux and macOS E2E have no cron of their
# own, so the routine suite cannot run twice from two independent schedules.
#
# 08:17 America/Los_Angeles every day. `timezone` is an IANA zone, so the wall
# clock stays 08:17 through PST (UTC-8, 16:17 UTC, early November through early
# March) and PDT (UTC-7, 15:17 UTC, early March through early November). 08:17
# is outside the spring-forward gap (02:00-03:00) and the fall-back repeated
# hour (01:00-02:00), so each local day still produces one run. GitHub fires
# this only from the default branch, on its latest commit, and may start it
# later when Actions is under load.
#
# workflow_dispatch here runs both suites. Dispatch Linux or macOS E2E directly
# when only one is needed. release.yml is not called from here: tag pushes and
# its own workflow_dispatch still publish.
on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  macos-e2e:
    uses: ./.github/workflows/macos-e2e.yml
