<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>256isenough</title>
<script>
// Runs before the first paint so theme and language never flash.
// Language order: ?lang=, saved choice, then navigator.languages (zh* -> zh, else en).
(function () {
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme");
  var lang = params.get("lang");
  try {
    if (theme !== "light" && theme !== "dark" && theme !== "system") theme = localStorage.getItem("isenough.theme");
    if (lang !== "zh" && lang !== "en") lang = localStorage.getItem("isenough.lang");
  } catch (e) {}
  if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
  if (lang !== "zh" && lang !== "en") {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    lang = String(prefs[0] || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }
  root.setAttribute("data-lang", lang);
  root.lang = lang === "zh" ? "zh-Hans" : "en";
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" id="skip" href="#apps" data-i18n="skip"></a>
<div class="window">
  <header class="toolbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">256</div>
      <div>
        <h1>256isenough</h1>
        <p class="sub" id="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="toolbar-actions">
      <button id="lang" type="button" class="lang-toggle"></button>
      <div id="theme" class="segmented" role="radiogroup">
        <button type="button" role="radio" data-theme-value="system" data-i18n="themeSystem"></button>
        <button type="button" role="radio" data-theme-value="light" data-i18n="themeLight"></button>
        <button type="button" role="radio" data-theme-value="dark" data-i18n="themeDark"></button>
      </div>
      <button id="refresh" type="button" class="primary" data-i18n="refresh"></button>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" hidden>
    <p id="banner-text"></p>
    <button id="retry" type="button" data-i18n="retry"></button>
  </div>
  <section id="expired" class="card expired" hidden aria-labelledby="expired-title">
    <h2 id="expired-title" data-i18n="expiredTitle"></h2>
    <p data-i18n="expiredBody"></p>
    <pre class="command"><code>isenough ui</code></pre>
  </section>
  <main id="content">
    <section id="onboarding" class="card hero" hidden aria-labelledby="onboarding-title">
      <h2 id="onboarding-title" data-i18n="heroTitle"></h2>
      <p class="muted" data-i18n="heroBody"></p>
      <ol class="steps">
        <li>
          <strong data-i18n="heroStep1"></strong>
          <span id="hero-repo" class="muted"></span>
          <pre class="command"><code>isenough init --root /Volumes/apps/256isenough</code></pre>
        </li>
        <li>
          <strong data-i18n="heroStep2"></strong>
          <span class="muted" data-i18n="heroStep2Body"></span>
          <a href="#recommend-section" class="link" data-i18n="heroStep2Link"></a>
        </li>
        <li>
          <strong data-i18n="heroStep3"></strong>
          <span class="muted" data-i18n="heroStep3Body"></span>
          <pre class="command"><code>isenough pack "/Applications/Example.app"</code></pre>
        </li>
      </ol>
    </section>
    <div class="grid">
      <article class="card" id="cache-card" data-level="ok" aria-labelledby="cache-title">
        <div class="card-head">
          <h2 id="cache-title" data-i18n="cache"></h2>
          <p class="near" id="near" hidden></p>
        </div>
        <div id="cache-body" aria-busy="true">
          <div class="skeleton sk-lg"></div>
          <div class="skeleton"></div>
          <div class="skeleton sk-short"></div>
        </div>
      </article>
      <article class="card" id="health-card" data-level="offline" aria-labelledby="health-title">
        <h2 id="health-title" data-i18n="backend"></h2>
        <div id="health-body" aria-busy="true">
          <div class="skeleton sk-lg"></div>
          <div class="skeleton"></div>
          <div class="skeleton sk-short"></div>
        </div>
      </article>
    </div>
    <section class="card" id="apps" aria-labelledby="apps-title">
      <div class="section-head">
        <h2 id="apps-title" data-i18n="apps"></h2>
        <button id="icon-backfill" type="button" class="quiet" data-i18n="backfillIcons"></button>
      </div>
      <div class="list-tools" id="list-tools">
        <label class="field grow">
          <span data-i18n="search"></span>
          <input id="search" type="search" autocomplete="off" spellcheck="false">
        </label>
        <label class="field">
          <span data-i18n="sortBy"></span>
          <select id="sort">
            <option value="name" data-i18n="sortName"></option>
            <option value="size" data-i18n="sortSize"></option>
            <option value="lastUsed" data-i18n="sortLastUsed"></option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="filterBy"></span>
          <select id="filter">
            <option value="all" data-i18n="filterAll"></option>
            <option value="cached" data-i18n="filterCached"></option>
            <option value="remote" data-i18n="filterRemote"></option>
            <option value="pinned" data-i18n="filterPinned"></option>
          </select>
        </label>
      </div>
      <div id="app-list" class="apps" aria-busy="true">
        <div class="skeleton sk-row"></div>
        <div class="skeleton sk-row"></div>
      </div>
    </section>
    <section class="card" id="recommend-section" aria-labelledby="recommend-title">
      <div class="section-head">
        <h2 id="recommend-title" data-i18n="recommend"></h2>
        <p class="scan-line">
          <span id="recommend-scanned" class="muted"></span>
          <button id="rescan" type="button" class="quiet" data-i18n="rescan"></button>
        </p>
      </div>
      <p id="recommend-total" class="total" hidden></p>
      <p id="recommend-summary" class="muted"></p>
      <div id="recommend-list" class="apps" aria-busy="true">
        <div class="skeleton sk-row"></div>
      </div>
      <h3 id="recommend-warn-title" class="warn-title" hidden data-i18n="recommendWarn"></h3>
      <ul id="recommend-warnings" class="sessions"></ul>
      <p id="recommend-leftovers" class="muted" hidden></p>
      <ul id="recommend-leftover-paths" class="sessions" hidden></ul>
    </section>
    <details class="card fold" id="devices-section">
      <summary><h2 id="devices-title" data-i18n="devices"></h2><span id="devices-count" class="count"></span></summary>
      <p id="devices-summary" class="muted"></p>
      <ul id="devices" class="sessions"></ul>
    </details>
    <details class="card fold" id="sessions-section">
      <summary><h2 id="sessions-title" data-i18n="sessions"></h2><span id="sessions-count" class="count"></span></summary>
      <p id="sessions-summary" class="muted"></p>
      <ul id="sessions" class="sessions"></ul>
    </details>
  </main>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" type="submit" value="cancel" data-i18n="cancel"></button>
      <button id="confirm-ok" type="submit" value="ok" class="danger"></button>
    </div>
  </form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
